<svg xmlns="http://www.w3.org/2000/svg" width="900" height="88" viewBox="0 0 900 88">
<title>Sumra reading themes</title>
<desc>Five built-in reading themes with sample text and link colors.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="10" y="10" width="169" height="68" rx="7" fill="#ffffff" stroke="#000000" stroke-opacity=".22"/>
<text x="19" y="29" fill="#000000" font-size="12" font-weight="600">Light</text>
<text x="19" y="55" fill="#000000" font-size="16">Aa</text>
<text x="53" y="54" fill="#000000" font-size="11">Sample text</text>
<text x="170" y="54" fill="#0020a0" font-size="11" text-anchor="end" text-decoration="underline">Link</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="187" y="10" width="169" height="68" rx="7" fill="#ebe6da" stroke="#333333" stroke-opacity=".22"/>
<text x="196" y="29" fill="#333333" font-size="12" font-weight="600">Light Warm</text>
<text x="196" y="55" fill="#333333" font-size="16">Aa</text>
<text x="230" y="54" fill="#333333" font-size="11">Sample text</text>
<text x="347" y="54" fill="#0020a0" font-size="11" text-anchor="end" text-decoration="underline">Link</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="364" y="10" width="169" height="68" rx="7" fill="#000000" stroke="#F9FAFB" stroke-opacity=".22"/>
<text x="373" y="29" fill="#F9FAFB" font-size="12" font-weight="600">Dark</text>
<text x="373" y="55" fill="#F9FAFB" font-size="16">Aa</text>
<text x="407" y="54" fill="#F9FAFB" font-size="11">Sample text</text>
<text x="524" y="54" fill="#6B7280" font-size="11" text-anchor="end" text-decoration="underline">Link</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="541" y="10" width="169" height="68" rx="7" fill="#282a36" stroke="#f8f8f2" stroke-opacity=".22"/>
<text x="550" y="29" fill="#f8f8f2" font-size="12" font-weight="600">Dracula</text>
<text x="550" y="55" fill="#f8f8f2" font-size="16">Aa</text>
<text x="584" y="54" fill="#f8f8f2" font-size="11">Sample text</text>
<text x="701" y="54" fill="#8be9fd" font-size="11" text-anchor="end" text-decoration="underline">Link</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="718" y="10" width="169" height="68" rx="7" fill="#282828" stroke="#ebdbb2" stroke-opacity=".22"/>
<text x="727" y="29" fill="#ebdbb2" font-size="12" font-weight="600">Gruvbox</text>
<text x="727" y="55" fill="#ebdbb2" font-size="16">Aa</text>
<text x="761" y="54" fill="#ebdbb2" font-size="11">Sample text</text>
<text x="878" y="54" fill="#83a598" font-size="11" text-anchor="end" text-decoration="underline">Link</text>
</g>
</svg>
